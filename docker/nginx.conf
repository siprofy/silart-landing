# Конфигурация nginx для статического сайта (подключается в Dockerfile).
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # /company/contacts → /company/contacts/ без внутреннего порта 8080 в Location
    # (иначе редирект ломается за прокси или при другом порте на хосте)
    absolute_redirect off;
    charset utf-8;

    # Базовые заголовки безопасности (наследуются всеми location без собственных add_header)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Проверка живости контейнера (HEALTHCHECK в Dockerfile, балансировщики)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Ассеты Astro содержат хеш в имени — их можно кешировать надолго
    location /_astro/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
