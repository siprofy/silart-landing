# Запуск сайта на сервере (/opt/silart/compose.yaml). Тег образа берётся из .env (TAG=<sha>),
# его записывает /usr/local/bin/silart-deploy. Подробности — docs/deploy.md, ADR-0009.
services:
  web:
    image: ghcr.io/siprofy/silart-landing:${TAG:?TAG не задан}
    ports:
      - "80:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
